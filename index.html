<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">

<title>Ponto do Brownie — Controle <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponto do Brownie — Controle Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --cocoa-950:#2A1810;
    --cocoa-900:#3A2318;
    --cocoa-700:#5C3A28;
    --cocoa-400:#9C7A5F;
    --parchment:#F2E8D5;
    --parchment-light:#FAF3E7;
    --brick:#A8433D;
    --brick-dark:#8A362F;
    --caramel:#C99B3C;
    --olive:#6B7A4F;
    --olive-dark:#54613D;
    --line:rgba(58,35,24,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--cocoa-950);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--caramel); color:var(--cocoa-950);}

  .app{max-width:720px; margin:0 auto; min-height:100vh; background:var(--parchment-light); box-shadow:0 0 40px rgba(0,0,0,0.08); position:relative;}

  /* HEADER — ticket style */
  header.top{
    background:var(--cocoa-950);
    color:var(--parchment);
    padding:28px 22px 22px;
    position:relative;
    overflow:hidden;
  }
  header.top::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:10px;
    background:
      linear-gradient(135deg, var(--cocoa-950) 25%, transparent 25%) -5px 0,
      linear-gradient(225deg, var(--cocoa-950) 25%, transparent 25%) -5px 0;
    background-size:10px 10px;
    background-color:var(--parchment-light);
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{
    font-family:'Fraunces',serif; font-weight:900; font-size:15px;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--caramel);
  }
  h1.title{
    font-family:'Fraunces',serif; font-weight:700; font-size:30px;
    margin:6px 0 2px; letter-spacing:-0.01em;
  }
  .subtitle{font-size:13px; color:var(--cocoa-400); font-family:'JetBrains Mono',monospace;}

  /* NAV */
  nav.tabs{
    display:flex; overflow-x:auto; background:var(--cocoa-900);
    padding:0 10px; gap:2px; -webkit-overflow-scrolling:touch;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto; background:none; border:none; color:var(--cocoa-400);
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding:14px 14px 12px; cursor:pointer; border-bottom:3px solid transparent;
    transition:color .15s, border-color .15s; white-space:nowrap;
  }
  nav.tabs button.active{color:var(--parchment-light); border-bottom-color:var(--caramel);}
  nav.tabs button:hover{color:var(--parchment-light);}

  main{padding:20px 18px 90px;}
  section{display:none;}
  section.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  h2.section-title{
    font-family:'Fraunces',serif; font-weight:700; font-size:20px; margin:0 0 4px;
  }
  p.section-hint{font-size:13px; color:var(--cocoa-700); margin:0 0 18px; line-height:1.5;}

  /* DASHBOARD CARDS */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .stat-card{
    background:var(--cocoa-950); color:var(--parchment-light); border-radius:10px;
    padding:16px 14px; position:relative; overflow:hidden;
  }
  .stat-card.wide{grid-column:1/-1;}
  .stat-card .label{font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--cocoa-400); font-weight:600;}
  .stat-card .value{font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; margin-top:6px;}
  .stat-card .value.brick{color:#E8837D;}
  .stat-card .value.olive{color:#A9BC85;}
  .stat-card .value.caramel{color:var(--caramel);}

  .goal-card{
    background:var(--parchment); border:1.5px solid var(--line); border-radius:10px;
    padding:16px; margin-bottom:16px;
  }
  .goal-card .row-between{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .goal-card .goal-label{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--cocoa-700); font-weight:600;}
  .goal-card .goal-pct{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;}
  .progress-track{height:10px; background:var(--line); border-radius:6px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--brick), var(--caramel)); border-radius:6px; transition:width .4s ease;}
  .goal-meta{display:flex; justify-content:space-between; font-size:12px; color:var(--cocoa-700); margin-top:8px; font-family:'JetBrains Mono',monospace;}

  .empty-state{
    text-align:center; padding:40px 20px; color:var(--cocoa-700);
    border:1.5px dashed var(--line); border-radius:10px; font-size:14px; line-height:1.6;
  }
  .empty-state .big{font-family:'Fraunces',serif; font-size:17px; color:var(--cocoa-950); margin-bottom:6px;}

  /* CARDS LIST (ingredients/products/sales) */
  .item-card{
    background:var(--parchment); border:1.5px solid var(--line); border-radius:10px;
    padding:14px 14px; margin-bottom:10px; display:flex; justify-content:space-between; gap:10px;
    align-items:flex-start;
  }
  .item-card .info{flex:1; min-width:0;}
  .item-card .name{font-weight:600; font-size:15px; margin-bottom:3px;}
  .item-card .meta{font-size:12.5px; color:var(--cocoa-700); font-family:'JetBrains Mono',monospace; line-height:1.6;}
  .item-card .meta .tag{display:inline-block;}
  .item-card .actions{display:flex; gap:6px; flex-shrink:0;}
  .icon-btn{
    border:none; background:transparent; cursor:pointer; padding:6px; border-radius:6px;
    color:var(--cocoa-700); display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{background:var(--line);}
  .icon-btn.danger:hover{background:rgba(168,67,61,0.15); color:var(--brick);}

  .margin-badge{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12.5px;
    padding:3px 8px; border-radius:20px; margin-top:6px;
  }
  .margin-badge.positive{background:rgba(107,122,79,0.16); color:var(--olive-dark);}
  .margin-badge.negative{background:rgba(168,67,61,0.16); color:var(--brick-dark);}

  .stock-badge{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px;
    padding:3px 8px; border-radius:20px; margin-top:6px; margin-right:6px;
  }
  .stock-badge.low{background:rgba(168,67,61,0.16); color:var(--brick-dark);}
  .stock-badge.ok{background:rgba(107,122,79,0.13); color:var(--olive-dark);}

  .stock-alert{
    background:rgba(168,67,61,0.09); border:1.5px solid rgba(168,67,61,0.32); border-radius:10px;
    padding:14px 14px; margin-bottom:16px;
  }
  .stock-alert .title{
    font-weight:700; font-size:13.5px; color:var(--brick-dark); margin-bottom:8px;
    display:flex; align-items:center; gap:6px; font-family:'Inter',sans-serif;
  }
  .stock-alert ul{margin:0; padding-left:20px; font-size:13px; color:var(--cocoa-950); line-height:1.8;}

  .payment-badge{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px;
    padding:3px 8px; border-radius:20px; margin-top:6px; margin-right:6px;
  }
  .payment-badge.paid{background:rgba(107,122,79,0.14); color:var(--olive-dark);}
  .payment-badge.pending{background:rgba(201,155,60,0.18); color:#8A6614;}

  .pending-alert{
    background:rgba(201,155,60,0.12); border:1.5px solid rgba(201,155,60,0.4); border-radius:10px;
    padding:14px; margin-bottom:16px;
  }
  .pending-alert .title{font-weight:700; font-size:13.5px; color:#8A6614; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .pending-alert .prow{display:flex; justify-content:space-between; font-size:13px; color:var(--cocoa-950); padding:6px 0; border-bottom:1px solid rgba(201,155,60,0.25);}
  .pending-alert .prow:last-child{border-bottom:none;}
  .pending-alert .prow .pval{font-family:'JetBrains Mono',monospace; font-weight:700;}

  /* BUTTONS */
  .btn-primary{
    width:100%; background:var(--brick); color:var(--parchment-light); border:none;
    padding:14px; border-radius:9px; font-weight:700; font-size:14px; cursor:pointer;
    font-family:'Inter',sans-serif; margin-top:6px; transition:background .15s;
  }
  .btn-primary:hover{background:var(--brick-dark);}
  .btn-secondary{
    width:100%; background:none; color:var(--cocoa-900); border:1.5px solid var(--cocoa-900);
    padding:12px; border-radius:9px; font-weight:600; font-size:13.5px; cursor:pointer;
    font-family:'Inter',sans-serif; margin-top:8px;
  }
  .fab{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    max-width:684px; width:calc(100% - 36px);
    z-index:20;
  }
  .fab .btn-primary{box-shadow:0 6px 20px rgba(168,67,61,0.35); font-size:15px; padding:15px;}

  /* FORMS */
  .form-panel{
    background:var(--cocoa-950); color:var(--parchment-light); border-radius:12px;
    padding:18px; margin-bottom:18px;
  }
  .form-panel h3{font-family:'Fraunces',serif; font-weight:700; font-size:17px; margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--cocoa-400); font-weight:600; margin-bottom:5px;}
  .field input, .field select{
    width:100%; padding:11px 12px; border-radius:7px; border:1.5px solid rgba(242,232,213,0.18);
    background:rgba(242,232,213,0.06); color:var(--parchment-light); font-size:14.5px;
    font-family:'Inter',sans-serif;
  }
  .field input::placeholder{color:rgba(242,232,213,0.35);}
  .field input:focus, .field select:focus{outline:none; border-color:var(--caramel);}
  .field select option{background:var(--cocoa-950); color:var(--parchment-light);}
  .field-row{display:flex; gap:8px;}
  .field-row .field{flex:1;}

  .unit-toggle{display:flex; gap:6px;}
  .unit-toggle button{
    flex:1; padding:11px 4px; border-radius:7px; border:1.5px solid rgba(242,232,213,0.18);
    background:rgba(242,232,213,0.06); color:var(--parchment-light); font-size:12.5px;
    font-family:'Inter',sans-serif; font-weight:600; cursor:pointer; transition:background .15s, border-color .15s;
  }
  .unit-toggle button.active{background:var(--caramel); color:var(--cocoa-950); border-color:var(--caramel);}

  .recipe-line{
    display:flex; gap:8px; align-items:center; margin-bottom:8px;
    background:rgba(242,232,213,0.05); padding:8px; border-radius:7px;
  }
  .recipe-line select{flex:2;}
  .recipe-line input{flex:1;}
  .recipe-line .icon-btn{color:rgba(242,232,213,0.6);}
  .add-line-btn{
    background:none; border:1.5px dashed rgba(242,232,213,0.3); color:var(--parchment-light);
    width:100%; padding:9px; border-radius:7px; font-size:13px; cursor:pointer; margin-bottom:10px;
    font-family:'Inter',sans-serif;
  }

  .form-actions{display:flex; gap:8px; margin-top:14px;}
  .form-actions .btn-primary{margin-top:0;}
  .btn-cancel{
    background:transparent; border:1.5px solid rgba(242,232,213,0.25); color:var(--parchment-light);
    padding:14px 18px; border-radius:9px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .calc-preview{
    background:rgba(201,155,60,0.12); border:1px solid rgba(201,155,60,0.3);
    border-radius:8px; padding:10px 12px; margin-top:4px; font-size:13px;
    font-family:'JetBrains Mono',monospace; color:var(--caramel); line-height:1.7;
  }

  .goal-need-list{margin-top:6px;}
  .goal-need-row{
    display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .goal-need-row:last-child{border-bottom:none;}
  .goal-need-row .pname{font-weight:600;}
  .goal-need-row .pval{font-family:'JetBrains Mono',monospace; color:var(--brick-dark); font-weight:700;}

  .period-bar{
    display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;
  }
  .period-bar input[type="month"], .period-bar input[type="date"]{
    padding:9px 10px; border-radius:7px; border:1.5px solid var(--line);
    background:var(--parchment); color:var(--cocoa-950); font-family:'JetBrains Mono',monospace;
    font-size:13px;
  }
  .chart-modes{display:flex; gap:6px;}
  .chart-modes button{
    background:none; border:1.5px solid var(--line); color:var(--cocoa-700);
    padding:7px 12px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .chart-modes button.active{background:var(--cocoa-950); color:var(--parchment-light); border-color:var(--cocoa-950);}
  .chart-card{
    background:var(--parchment); border:1.5px solid var(--line); border-radius:10px;
    padding:16px 14px; margin-bottom:16px;
  }
  .chart-card h3{font-family:'Fraunces',serif; font-size:16px; font-weight:700; margin:0 0 12px;}
  .chart-canvas-wrap{position:relative; height:220px;}
  .day-lookup{
    background:var(--parchment); border:1.5px solid var(--line); border-radius:10px;
    padding:14px; margin-bottom:16px;
  }
  .day-lookup .row-between{margin-bottom:10px;}
  .day-lookup-result{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; font-family:'Inter',sans-serif; color:var(--cocoa-700);}
  .day-lookup-result span{display:flex; flex-direction:column;}
  .day-lookup-result b{font-size:16px; font-family:'JetBrains Mono',monospace; color:var(--cocoa-950); font-weight:700;}

  .loading{text-align:center; padding:60px 20px; color:var(--cocoa-700); font-family:'JetBrains Mono',monospace; font-size:13px;}

  /* CUSTOM MODAL (substitui alert/confirm/prompt nativos) */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(42,24,16,0.6); z-index:150;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal-box{
    background:var(--cocoa-950); color:var(--parchment-light); border-radius:12px;
    padding:20px; max-width:340px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.4);
  }
  .modal-box p{font-size:14px; line-height:1.5; margin:0 0 16px; font-family:'Inter',sans-serif;}
  .modal-box input{
    width:100%; padding:11px 12px; border-radius:7px; border:1.5px solid rgba(242,232,213,0.18);
    background:rgba(242,232,213,0.06); color:var(--parchment-light); font-size:14.5px;
    font-family:'Inter',sans-serif; margin-bottom:14px;
  }
  .modal-box input:focus{outline:none; border-color:var(--caramel);}
  .modal-actions{display:flex; gap:8px;}
  .modal-actions button{flex:1; margin-top:0;}

  /* LOCK SCREEN */
  #lockScreen{
    position:fixed; inset:0; background:var(--cocoa-950); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .lock-box{width:100%; max-width:340px; text-align:center;}
  .lock-box .mark{
    font-family:'Fraunces',serif; font-weight:900; font-size:13px;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--caramel); display:block; margin-bottom:6px;
  }
  .lock-box h2{
    font-family:'Fraunces',serif; font-weight:700; font-size:22px; color:var(--parchment-light);
    margin:0 0 6px;
  }
  .lock-box p{font-size:13px; color:var(--cocoa-400); margin:0 0 20px; line-height:1.5;}
  .lock-box input{
    width:100%; padding:13px 14px; border-radius:8px; border:1.5px solid rgba(242,232,213,0.18);
    background:rgba(242,232,213,0.06); color:var(--parchment-light); font-size:16px;
    font-family:'JetBrains Mono',monospace; text-align:center; letter-spacing:0.1em;
    margin-bottom:10px;
  }
  .lock-box input:focus{outline:none; border-color:var(--caramel);}
  .lock-box input::placeholder{color:rgba(242,232,213,0.3); letter-spacing:normal; font-family:'Inter',sans-serif;}
  .lock-error{color:#E8837D; font-size:12.5px; margin:-2px 0 12px; min-height:16px; font-family:'Inter',sans-serif;}
  .lock-box .hint{font-size:11.5px; color:var(--cocoa-400); margin-top:16px; line-height:1.5;}

  @media (max-width:400px){
    .stat-card .value{font-size:20px;}
  }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box" id="lockBoxContent">
    <span class="mark">Ponto do Brownie</span>
    <div class="loading">verificando…</div>
  </div>
</div>

<div class="app">

  <header class="top">
    <div class="brand"><span class="mark">Ponto do Brownie</span></div>
    <h1 class="title">Controle Financeiro</h1>
    <div class="subtitle" id="headerDate">carregando…</div>
  </header>

  <nav class="tabs">
    <button data-tab="painel" class="active">Painel</button>
    <button data-tab="vendas">Vendas</button>
    <button data-tab="fidelidade">Fidelidade</button>
    <button data-tab="estoque">Estoque</button>
    <button data-tab="ingredientes">Ingredientes</button>
    <button data-tab="massas">Bases</button>
    <button data-tab="meta">Meta</button>
  </nav>

  <main id="mainContent">
    <div class="loading">carregando seus dados…</div>
  </main>
</div>

<script>
const STORAGE_KEY = 'appData';
const SALES_KEY = 'sales';
const AUTH_KEY = 'authConfig';

let state = {
  ingredients: [],
  bases: [],
  fillings: [],
  packaging: [],
  products: [],
  goal: { type: 'profit', value: 0 },
  loyaltyRedemptionLog: []
};
let sales = [];
let ready = false;
let activeTab = 'painel';
let recipeLineCount = 0;

const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);
const fmt = n => (Number(n)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtNum = n => (Number(n)||0).toLocaleString('pt-BR', {maximumFractionDigits:2});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function setHeaderDate(){
  const d = new Date();
  $('#headerDate').textContent = `${MONTHS[d.getMonth()]} de ${d.getFullYear()}`;
}

// ---------- STORAGE (Google Sheets via Apps Script) ----------
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzvA-c9Y-KtMC_NLJenbDEfBqFWd3LBTUlScxbZXRTxsxxhs1e3cfZL1FzmREHCfHbOqQ/exec';

async function sheetGet(key){
  try{
    const res = await fetch(`${GAS_URL}?key=${encodeURIComponent(key)}`);
    const text = await res.text();
    if(!text || text==='null') return null;
    return JSON.parse(text);
  }catch(e){
    console.error('erro ao ler '+key, e);
    return null;
  }
}
async function sheetSet(key, value){
  try{
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({key, value})
    });
    const text = await res.text();
    const parsed = JSON.parse(text);
    return !!(parsed && parsed.ok);
  }catch(e){
    console.error('erro ao salvar '+key, e);
    return false;
  }
}

async function loadData(){
  const parsed = await sheetGet(STORAGE_KEY);
  if(parsed) state = Object.assign(state, parsed);
  const salesData = await sheetGet(SALES_KEY);
  if(salesData) sales = salesData;
  ready = true;
}

function showToast(message, isError=false){
  const banner = document.createElement('div');
  banner.textContent = message;
  banner.style.cssText = `position:fixed;left:16px;right:16px;bottom:90px;z-index:200;background:${isError?'#8A362F':'#3A2318'};color:#FAF3E7;padding:12px 16px;border-radius:10px;font-family:Inter,sans-serif;font-size:13px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,0.3);`;
  document.body.appendChild(banner);
  setTimeout(()=>banner.remove(), 4000);
}
function showSaveError(){
  showToast('Não consegui salvar agora — verifique sua internet e tente de novo em instantes.', true);
}

function showConfirmModal(message){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');

    document.body.appendChild(overlay);

function showPromptModal(message, defaultValue=''){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <p>${escapeHtml(message)}</p>
        <input id="modalPromptInput" type="text" value="${escapeAttr(defaultValue)}">
        <div class="modal-actions">
          <button class="btn-cancel" id="modalCancelBtn">Cancelar</button>
          <button class="btn-primary" id="modalConfirmBtn" style="margin-top:0;">OK</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#modalPromptInput');
    input.focus();
    input.select();
    const submit = ()=>{ const v = input.value; overlay.remove(); resolve(v); };
    overlay.querySelector('#modalCancelBtn').onclick = ()=>{ overlay.remove(); resolve(null); };
    overlay.querySelector('#modalConfirmBtn').onclick = submit;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  });
}

async function storageSetWithRetry(key, value, attempts=2){
  for(let i=0; i<attempts; i++){
    const ok = await sheetSet(key, value);
    if(ok) return true;
    if(i<attempts-1){ await new Promise(r=>setTimeout(r, 700)); }
  }
  return false;
}

  const ok = await storageSetWithRetry(STORAGE_KEY, JSON.stringify(state));
  if(!ok) showSaveError();
}
async function saveSales(){
  const ok = await storageSetWithRetry(SALES_KEY, JSON.stringify(sales));
  if(!ok) showSaveError();
}

// ---------- CALC HELPERS ----------
function ingredientUnitCost(ing){
  if(!ing.packageQty) return 0;
  return ing.packageCost / ing.packageQty;
}
function currentPackages(ing){
  if(!ing.packageQty) return 0;
  return (ing.stockQty||0) / ing.packageQty;
}
function isLowStock(ing){
  if(!ing.minStockPackages || ing.minStockPackages<=0) return false;
  return currentPackages(ing) < ing.minStockPackages;
}
function lowStockIngredients(){
  return state.ingredients.filter(isLowStock);
}
function baseCost(base){
  if(!base) return {totalBatch:0, costPerUnit:0};
  const ingCost = (base.items||[]).reduce((sum, item)=>{
    const ing = state.ingredients.find(i=>i.id===item.ingredientId);
    if(!ing) return sum;
    return sum + ingredientUnitCost(ing) * item.qty;
  }, 0);
  const totalBatch = ingCost + (Number(base.extraCost)||0);
  const yieldQty = Number(base.yield) || 1;
  return {totalBatch, costPerUnit: totalBatch/yieldQty};
}
function fillingCost(filling){
  if(!filling) return {totalBatch:0, costPerUnit:0};
  const ingCost = (filling.items||[]).reduce((sum, item)=>{
    const ing = state.ingredients.find(i=>i.id===item.ingredientId);
    if(!ing) return sum;
    return sum + ingredientUnitCost(ing) * item.qty;
  }, 0);
  const pkgCost = (filling.packaging||[]).reduce((sum, item)=>{
    const pkg = state.packaging.find(i=>i.id===item.packagingId);
    if(!pkg) return sum;
    return sum + packagingUnitCost(pkg) * item.qty;
  }, 0);
  const totalBatch = ingCost + pkgCost + (Number(filling.extraCost)||0);
  const yieldQty = Number(filling.yield) || 1;
  return {totalBatch, costPerUnit: totalBatch/yieldQty};
}
function getProductFillings(product){
  if(product.fillings && product.fillings.length) return product.fillings;
  if(product.fillingId) return [{fillingId: product.fillingId, qty: product.fillingQty||0}];
  return [];
}
function consumeIngredientsForProduction(product, qty){
  if(!product) return;
  (product.items||[]).forEach(item=>{
    const pkg = state.packaging.find(i=>i.id===item.packagingId);
    if(!pkg) return;
    const perUnit = item.qty / (Number(product.yield)||1);
    pkg.stockQty = (pkg.stockQty||0) - perUnit*qty;
  });
  if(product.baseId){
    const base = state.bases.find(b=>b.id===product.baseId);
    if(base){
      const baseAmountPerUnit = (Number(product.baseQty)||0) / (Number(product.yield)||1);
      (base.items||[]).forEach(item=>{
        const ing = state.ingredients.find(i=>i.id===item.ingredientId);
        if(!ing) return;
        const perUnitOfBase = item.qty / (Number(base.yield)||1);
        ing.stockQty = (ing.stockQty||0) - perUnitOfBase * baseAmountPerUnit * qty;
      });
    }
  }
  getProductFillings(product).forEach(f=>{
    const filling = state.fillings.find(x=>x.id===f.fillingId);
    if(!filling) return;
    const fillingAmountPerUnit = (Number(f.qty)||0) / (Number(product.yield)||1);
    (filling.items||[]).forEach(item=>{
      const ing = state.ingredients.find(i=>i.id===item.ingredientId);
      if(!ing) return;
      const perUnitOfFilling = item.qty / (Number(filling.yield)||1);
      ing.stockQty = (ing.stockQty||0) - perUnitOfFilling * fillingAmountPerUnit * qty;
    });
    (filling.packaging||[]).forEach(item=>{
      const pkg = state.packaging.find(i=>i.id===item.packagingId);
      if(!pkg) return;
      const perUnitOfFilling = item.qty / (Number(filling.yield)||1);
      pkg.stockQty = (pkg.stockQty||0) - perUnitOfFilling * fillingAmountPerUnit * qty;
    });
  });
}
function productCost(product){
  const pkgCost = (product.items||[]).reduce((sum, item)=>{
    const pkg = state.packaging.find(i=>i.id===item.packagingId);
    if(!pkg) return sum;
    return sum + packagingUnitCost(pkg) * item.qty;
  }, 0);
  let baseComponentCost = 0;
  if(product.baseId){
    const base = state.bases.find(b=>b.id===product.baseId);
    if(base){
      baseComponentCost = baseCost(base).costPerUnit * (Number(product.baseQty)||0);
    }
  }
  let fillingComponentCost = 0;
  getProductFillings(product).forEach(f=>{
    const filling = state.fillings.find(x=>x.id===f.fillingId);
    if(filling) fillingComponentCost += fillingCost(filling).costPerUnit * (Number(f.qty)||0);
  });
  const totalBatch = pkgCost + baseComponentCost + fillingComponentCost + (Number(product.extraCost)||0);
  const yieldQty = Number(product.yield) || 1;
  return totalBatch / yieldQty;
}
function productMargin(product){
  const cost = productCost(product);
  const price = Number(product.sellPrice)||0;
  const margin = price - cost;
  const pct = price ? (margin/price*100) : 0;
  return {cost, margin, pct};
}
function goalNeedListHTML(remaining){
  if(!state.products.length) return '';
  const goalIsProfit = state.goal.type==='profit';
  let html = `<div class="goal-need-list">`;
  state.products.forEach(p=>{
    const {margin} = productMargin(p);
    const basis = goalIsProfit ? margin : Number(p.sellPrice);
    let text;
    if(remaining<=0){ text = 'meta batida ✓'; }
    else if(basis<=0){ text = '—'; }
    else { text = `${Math.ceil(remaining/basis)} un.`; }
    html += `<div class="goal-need-row"><span class="pname">${escapeHtml(p.name)}</span><span class="pval">${text}</span></div>`;
  });
  html += `</div>`;
  return html;
}
function avgUnitsNeeded(remaining){
  const goalIsProfit = state.goal.type==='profit';
  const bases = state.products.map(p=>{
    const {margin} = productMargin(p);
    return goalIsProfit ? margin : Number(p.sellPrice);
  }).filter(b=>b>0);
  if(!bases.length || remaining<=0) return 0;
  const avgBasis = bases.reduce((a,b)=>a+b,0)/bases.length;
  return avgBasis>0 ? Math.ceil(remaining/avgBasis) : 0;
}
let painelMonth = new Date().toISOString().slice(0,7); // 'YYYY-MM'
let painelChartMode = 'dia';
let salesChartInstance = null;
const MONTHS_SHORT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function salesForMonth(yearMonth){
  return sales.filter(s=>s.date && s.date.startsWith(yearMonth));
}
function currentMonthSales(){
  return salesForMonth(new Date().toISOString().slice(0,7));
}
function saleTotal(sale){
  return (sale.items||[]).reduce((sum,it)=>sum+it.qty*it.unitPrice,0);
}
function summaryForSales(list){
  let revenue=0, cost=0, unitsSold=0;
  list.forEach(s=>{
    (s.items||[]).forEach(it=>{
      const p = state.products.find(pr=>pr.id===it.productId);
      revenue += it.qty * it.unitPrice;
      cost += p ? productCost(p) * it.qty : 0;
      unitsSold += it.qty;
    });
  });
  return {revenue, cost, profit: revenue-cost, count: list.length, unitsSold};
}
function monthSummary(){
  return summaryForSales(currentMonthSales());
}
function monthSummaryFor(yearMonth){
  return summaryForSales(salesForMonth(yearMonth));
}
function daySummary(dateStr){
  const list = sales.filter(s=>s.date===dateStr);
  return summaryForSales(list);
}

// ---------- CHART DATA ----------
function revenueByDateMap(){
  const map = {};
  sales.forEach(s=>{ map[s.date] = (map[s.date]||0) + saleTotal(s); });
  return map;
}
function dailyChartData(yearMonth){
  const [y,m] = yearMonth.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const revByDate = revenueByDateMap();
  const labels=[], data=[];
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    labels.push(String(d));
    data.push(revByDate[dateStr]||0);
  }
  return {labels, data};
}
function weeklyChartData(yearMonth){
  const {data: dayData} = dailyChartData(yearMonth);
  const weeks = {};
  dayData.forEach((val, idx)=>{
    const weekNum = Math.ceil((idx+1)/7);
    weeks[weekNum] = (weeks[weekNum]||0) + val;
  });
  return {labels: Object.keys(weeks).map(w=>`Sem ${w}`), data: Object.values(weeks)};
}
function monthlyChartData(yearMonth){
  const [y,m] = yearMonth.split('-').map(Number);
  const revByDate = revenueByDateMap();
  const labels=[], data=[];
  for(let i=11; i>=0; i--){
    const d = new Date(y, m-1-i, 1);
    const yy = d.getFullYear(), mm = d.getMonth()+1;
    const prefix = `${yy}-${String(mm).padStart(2,'0')}`;
    let sum = 0;
    Object.keys(revByDate).forEach(dateStr=>{ if(dateStr.startsWith(prefix)) sum += revByDate[dateStr]; });
    labels.push(`${MONTHS_SHORT[mm-1]}/${String(yy).slice(2)}`);
    data.push(sum);
  }
  return {labels, data};
}
function renderSalesChart(){
  const canvas = document.getElementById('salesChart');
  if(!canvas || typeof Chart==='undefined') return;
  let chartData;
  if(painelChartMode==='dia') chartData = dailyChartData(painelMonth);
  else if(painelChartMode==='semana') chartData = weeklyChartData(painelMonth);

  if(salesChartInstance){ salesChartInstance.destroy(); }

  });
}

function packagingUnitCost(pkg){
  if(!pkg.packageQty) return 0;
  return pkg.packageCost / pkg.packageQty;
}
function currentPackagingPackages(pkg){
  if(!pkg.packageQty) return 0;
  return (pkg.stockQty||0) / pkg.packageQty;
}
function isLowStockPackaging(pkg){
  if(!pkg.minStockPackages || pkg.minStockPackages<=0) return false;
  return currentPackagingPackages(pkg) < pkg.minStockPackages;
}
function lowStockPackaging(){
  return state.packaging.filter(isLowStockPackaging);
}

async function restockPackaging(id){
  const pkg = state.packaging.find(i=>i.id===id);
  if(!pkg) return;
  const result = await showPurchaseModal(`Registrar compra — "${pkg.name}"`);
  if(!result) return;
  const qty = parseFloat(String(result.qty).replace(',','.'));
  const price = parseFloat(String(result.price).replace(',','.'));

        <div class="field" style="margin-bottom:12px;">

          <button class="btn-primary" id="modalConfirmBtn" style="margin-top:0;">Adicionar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const qtyInput = overlay.querySelector('#modalQtyInput');
    const priceInput = overlay.querySelector('#modalPriceInput');
    qtyInput.focus();
    const submit = ()=>{
      const val = {qty: qtyInput.value, price: priceInput.value};
      overlay.remove();
      resolve(val);
    };
    overlay.querySelector('#modalCancelBtn').onclick = ()=>{ overlay.remove(); resolve(null); };
    overlay.querySelector('#modalConfirmBtn').onclick = submit;
    [qtyInput, priceInput].forEach(inp=>inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); }));
  });
}

function updateCalcPreview(){
  const items = readPackagingLinesFrom('recipeLines');
  const extra = parseFloat($('#pExtra')?.value)||0;
  const yieldQty = parseFloat($('#pYield')?.value)||0;
  const price = parseFloat($('#pPrice')?.value)||0;
  const pkgCost = items.reduce((sum,item)=>{
    const pkg = state.packaging.find(i=>i.id===item.packagingId);
    return pkg ? sum + packagingUnitCost(pkg)*item.qty : sum;
  },0);
  let baseComponentCost = 0;
  const baseSelect = $('#pBase');
  if(baseSelect && baseSelect.value){
    const base = state.bases.find(b=>b.id===baseSelect.value);
    const baseQty = parseFloat($('#pBaseQty')?.value)||0;
    if(base) baseComponentCost = baseCost(base).costPerUnit * baseQty;
  }
  let fillingComponentCost = 0;
  readFillingLines().forEach(f=>{
    const filling = state.fillings.find(x=>x.id===f.fillingId);
    if(filling) fillingComponentCost += fillingCost(filling).costPerUnit * f.qty;
  });
  const totalBatch = pkgCost + baseComponentCost + fillingComponentCost + extra;
  const costPerUnit = yieldQty>0 ? totalBatch/yieldQty : 0;
  const margin = price - costPerUnit;
  const pct = price ? (margin/price*100) : 0;
  const el = $('#calcPreview');
  if(!el) return;
  el.innerHTML = `${baseComponentCost>0?`custo da massa usada: ${fmt(baseComponentCost)}<br>`:''}${fillingComponentCost>0?`custo dos recheios usados: ${fmt(fillingComponentCost)}<br>`:''}custo da receita: ${fmt(totalBatch)}<br>custo por unidade: ${fmt(costPerUnit)}<br>margem por unidade: ${fmt(margin)} (${pct.toFixed(0)}%)`;
}

async function saveProduct(editId){
  const name = $('#pName').value.trim();
  const items = readPackagingLinesFrom('recipeLines');
  const yieldQty = parseFloat($('#pYield').value);
  const extraCost = parseFloat($('#pExtra').value)||0;
  const sellPrice = parseFloat($('#pPrice').value);
  const baseSelect = $('#pBase');
  const baseId = baseSelect ? (baseSelect.value||null) : null;
  const baseQty = baseId ? (parseFloat($('#pBaseQty').value)||0) : 0;
  const fillings = readFillingLines();
  if(!name || (!baseId && fillings.length===0) || isNaN(yieldQty) || yieldQty<=0 || isNaN(sellPrice)){
    showToast('Preencha nome, rendimento, preço de venda e pelo menos uma massa ou recheio.', true);
    return;
  }
  if(editId){
    const p = state.products.find(p=>p.id===editId);
    Object.assign(p, {name, items, yield:yieldQty, extraCost, sellPrice, baseId, baseQty, fillings, fillingId:null, fillingQty:0});
  } else {
    state.products.push({id:uid(), name, items, yield:yieldQty, extraCost, sellPrice, baseId, baseQty, fillings, stockQty:0});
  }
  render();
  saveState();
}
function editProduct(id){ render(); showProductForm(id); $('#productForm').scrollIntoView({behavior:'smooth'}); }
async function deleteProduct(id){
  if(!(await showConfirmModal('Excluir este produto?'))) return;
  state.products = state.products.filter(p=>p.id!==id);
  render();
  saveState();
}

async function produceStock(productId){
  const product = state.products.find(p=>p.id===productId);
  if(!product) return;
  const input = await showPromptModal(`Quantas unidades de "${product.name}" você acabou de produzir?`, '');
  if(input===null) return;
  const qty = parseFloat(String(input).replace(',','.'));
  if(isNaN(qty) || qty<=0){
    showToast('Digite um número válido.', true);
    return;
  }
  consumeIngredientsForProduction(product, qty);
  product.stockQty = (product.stockQty||0) + qty;
  render();
  saveState();
  showToast(`${fmtNum(qty)} unidade(s) de "${product.name}" adicionadas ao estoque.`);
}

async function adjustStock(productId){
  const product = state.products.find(p=>p.id===productId);
  if(!product) return;
  const input = await showPromptModal(`Ajustar estoque de "${product.name}" para quantas unidades? (não mexe nos ingredientes, só corrige o número)`, String(product.stockQty||0));
  if(input===null) return;
  const qty = parseFloat(String(input).replace(',','.'));
  if(isNaN(qty) || qty<0){
    showToast('Digite um número válido.', true);
    return;
  }
  product.stockQty = qty;
  render();
  saveState();
}

// ---------- FIDELIDADE (loyalty) ----------
const LOYALTY_START = '2026-08-10';
const LOYALTY_TARGET = 10;

function normalizeBuyerKey(name){
  return (name||'').trim().toLowerCase();
}
function loyaltyEligibleSales(){
  return sales.filter(s => s.buyerName && s.buyerName.trim() && s.date >= LOYALTY_START);
}
function loyaltyCustomers(){
  const map = {};
  loyaltyEligibleSales().forEach(s=>{
    const key = normalizeBuyerKey(s.buyerName);
    if(!map[key]) map[key] = {key, displayName: s.buyerName.trim(), units: 0, lastDate: s.date};
    (s.items||[]).forEach(it=>{ map[key].units += it.qty; });
    if(s.date > map[key].lastDate){ map[key].lastDate = s.date; map[key].displayName = s.buyerName.trim(); }
  });
  return Object.values(map).sort((a,b)=>b.units-a.units);
}
function loyaltyRedemptionLog(){
  return state.loyaltyRedemptionLog || [];
}
function redeemedCountFor(key){
  return loyaltyRedemptionLog().filter(r=>r.key===key).length;
}
function loyaltySummary(customer){
  const earned = Math.floor(customer.units / LOYALTY_TARGET);
  const redeemed = redeemedCountFor(customer.key);
  const available = Math.max(0, earned - redeemed);
  const progress = customer.units % LOYALTY_TARGET;
  return {earned, redeemed, available, progress};
}
function loyaltyTotalCost(){
  return loyaltyRedemptionLog().reduce((s,r)=>s+(r.cost||0), 0);
}
function loyaltyCostForMonth(yearMonth){
  return loyaltyRedemptionLog().filter(r=>r.date && r.date.startsWith(yearMonth)).reduce((s,r)=>s+(r.cost||0), 0);
}
function renderFidelidade(){
  const customers = loyaltyCustomers();
  const startFmt = new Date(LOYALTY_START+'T00:00:00').toLocaleDateString('pt-BR');
  const totalGiven = loyaltyRedemptionLog().length;
  const totalCost = loyaltyTotalCost();
  return `
    <h2 class="section-title">Fidelidade</h2>
    <p class="section-hint">A cada ${LOYALTY_TARGET} brownies comprados (desde ${startFmt}), o cliente ganha 1 brownie grátis. Vendas sem nome do comprador, ou antes de ${startFmt}, não contam.</p>
    ${totalGiven>0 ? `
    <div class="stat-card wide" style="margin-bottom:16px;">
      <div class="label">Investido em brindes até agora</div>
      <div class="value brick">${fmt(totalCost)}</div>
      <div class="meta" style="color:var(--cocoa-400); margin-top:4px;">${totalGiven} brownie(s) grátis dado(s) no total</div>
    </div>` : ''}
    ${customers.length===0 ? `
      <div class="empty-state">
        <div class="big">Nenhum cliente com pontos ainda</div>
        Assim que você registrar vendas com o nome do comprador (a partir de ${startFmt}), eles aparecem aqui.
      </div>` : customers.map(c=>{
        const {available, progress, redeemed} = loyaltySummary(c);
        const pct = (progress/LOYALTY_TARGET)*100;
        return `
      <div class="item-card" style="display:block;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span class="name">${escapeHtml(c.displayName)}</span>
          ${available>0 ? `<span class="stock-badge ok">${available} grátis disponível${available>1?'is':''}</span>` : ''}
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="goal-meta" style="margin-top:6px;">
          <span>${progress}/${LOYALTY_TARGET} pro próximo grátis</span>
          <span>${fmtNum(c.units)} unidades no total${redeemed>0?` · ${redeemed} já resgatado${redeemed>1?'s':''}`:''}</span>
        </div>
        ${available>0 ? `<button class="btn-primary" style="margin-top:12px;" onclick="redeemLoyalty('${c.key}')">Resgatar 1 brownie grátis</button>` : ''}
      </div>`;}).join('')}
  `;
}

    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">

        <select id="loyaltyProductSelect" style="width:100%; padding:11px 12px; border-radius:7px; border:1.5px solid rgba(242,232,213,0.18); background:rgba(242,232,213,0.06); color:var(--parchment-light); font-size:14.5px; font-family:'Inter',sans-serif; margin-bottom:14px;">
          ${state.products.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
        </select>
        <div class="modal-actions">
          <button class="btn-cancel" id="modalCancelBtn">Cancelar</button>
          <button class="btn-primary" id="modalConfirmBtn" style="margin-top:0;">Confirmar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#modalCancelBtn').onclick = ()=>{ overlay.remove(); resolve(null); };
    overlay.querySelector('#modalConfirmBtn').onclick = ()=>{
      const v = overlay.querySelector('#loyaltyProductSelect').value;
      overlay.remove();
      resolve(v);
    };
  });
}
async function redeemLoyalty(key){
  const customer = loyaltyCustomers().find(c=>c.key===key);
  if(!customer) return;
  const {available} = loyaltySummary(customer);
  if(available<=0) return;
  if(state.products.length===0){
    showToast('Cadastre um produto primeiro pra saber o custo do brindezinho.', true);
    return;
  }
  const productId = await loyaltyProductSelectModal(`Qual sabor ${customer.displayName} recebeu de graça?`);
  if(!productId) return;
  const product = state.products.find(p=>p.id===productId);
  if(!(await showConfirmModal(`Confirmar que ${customer.displayName} recebeu 1 "${product.name}" grátis agora?`))) return;
  const cost = productCost(product);
  state.loyaltyRedemptionLog = state.loyaltyRedemptionLog || [];
  state.loyaltyRedemptionLog.push({key, displayName: customer.displayName, productId, productName: product.name, cost, date: new Date().toISOString().slice(0,10)});
  product.stockQty = (product.stockQty||0) - 1;
  render();
  saveState();
}

// ---------- RENDER: VENDAS ----------
const PAYMENT_LABELS = {pix:'Pix', dinheiro:'Dinheiro', cartao:'Cartão'};

function pendingSales(){
  return sales.filter(s=>s.paymentStatus==='pendente');
}

function renderVendas(){
  const sorted = sales.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const pending = pendingSales();
  const pendingHTML = pending.length>0 ? `
    <div class="pending-alert">
      <div class="title">${iconAlert()} Fiado — aguardando pagamento (${fmt(pending.reduce((sum,s)=>sum+saleTotal(s),0))})</div>
      ${pending.map(s=>{
        const due = s.dueDate ? new Date(s.dueDate+'T00:00:00').toLocaleDateString('pt-BR') : 'sem data prevista';
        const names = (s.items||[]).map(it=>{
          const p = state.products.find(pr=>pr.id===it.productId);
          return p ? `${p.name} (${it.qty})` : '';
        }).filter(Boolean).join(', ');
        return `<div class="prow"><span>${escapeHtml(s.buyerName||'Sem nome')} — ${escapeHtml(names)} · ${due}</span><span class="pval">${fmt(saleTotal(s))}</span></div>`;
      }).join('')}
    </div>` : '';
  return `
    <h2 class="section-title">Vendas</h2>
    <p class="section-hint">Registre cada venda para acompanhar faturamento, progresso da meta e quem ainda vai pagar. Uma venda pode ter mais de um sabor.</p>
    ${pendingHTML}
    <div id="saleForm"></div>
    ${sorted.length===0 ? `
      <div class="empty-state">
        <div class="big">Nenhuma venda lançada</div>
        ${state.products.length===0 ? 'Cadastre um produto primeiro, na aba anterior.' : 'Registre sua primeira venda para começar a acompanhar o mês.'}
      </div>` : sorted.map(s=>{
        const dateFmt = new Date(s.date+'T00:00:00').toLocaleDateString('pt-BR');
        const isPaid = s.paymentStatus==='pago';
        const dueFmt = s.dueDate ? new Date(s.dueDate+'T00:00:00').toLocaleDateString('pt-BR') : null;
        const itemsHTML = (s.items||[]).map(it=>{
          const p = state.products.find(pr=>pr.id===it.productId);
          return `${p?escapeHtml(p.name):'(produto removido)'} — ${it.qty} un. × ${fmt(it.unitPrice)}`;
        }).join('<br>');
        return `
      <div class="item-card">
        <div class="info">
          <div class="name">${s.buyerName?escapeHtml(s.buyerName):dateFmt}</div>
          <div class="meta">${itemsHTML}</div>
          <div class="meta">${dateFmt} · total: <strong>${fmt(saleTotal(s))}</strong></div>
          <span class="payment-badge ${isPaid?'paid':'pending'}">${isPaid ? 'Pago · '+(PAYMENT_LABELS[s.paymentMethod]||'') : 'Fiado'+(dueFmt?' · vence '+dueFmt:'')}</span>
        </div>
        <div class="actions">
          ${!isPaid ? `<button class="icon-btn" onclick="markSalePaid('${s.id}')" aria-label="Marcar como pago">${iconCheck()}</button>` : ''}
          <button class="icon-btn danger" onclick="deleteSale('${s.id}')" aria-label="Excluir">${iconTrash()}</button>
        </div>
      </div>`;}).join('')}
    <div class="fab"><button class="btn-primary" onclick="showSaleForm()" ${state.products.length===0?'disabled style="opacity:.5"':''}>+ Nova venda</button></div>
  `;
}

function showSaleForm(){
  const today = new Date().toISOString().slice(0,10);
  recipeLineCount = 0;
  const html = `
    <div class="form-panel">
      <h3>Nova venda</h3>
      <div class="field">
        <label>Itens da venda (pode adicionar mais de um sabor)</label>
        <div id="saleLines"></div>
        <button type="button" class="add-line-btn" onclick="addSaleLine()">+ adicionar item</button>
      </div>
      <div class="calc-preview" id="saleTotalPreview">Total da venda: R$ 0,00</div>
      <div class="field">
        <label>Data</label>
        <input id="sDate" type="date" value="${today}">
      </div>
      <div class="field">
        <label>Nome do comprador (opcional)</label>
        <input id="sBuyer" placeholder="Ex: Maria">
      </div>
      <div class="field">
        <label>Pagamento</label>
        <select id="sStatus" onchange="onSaleStatusChange()">
          <option value="pago">Pago agora</option>
          <option value="pendente">Fica pra depois (fiado)</option>
        </select>
      </div>
      <div id="saleStatusFields"></div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeForm('saleForm')">Cancelar</button>
        <button class="btn-primary" onclick="saveSale()">Registrar venda</button>
      </div>
    </div>`;
  $('#saleForm').innerHTML = html;
  addSaleLine();
  onSaleStatusChange();
}

function addSaleLine(productId='', qty='1', unitPrice=''){
  const lineId = 'sl_' + (recipeLineCount++);
  const pid = productId || state.products[0]?.id || '';
  const product = state.products.find(p=>p.id===pid);
  const price = unitPrice!=='' ? unitPrice : (product ? product.sellPrice : '');
  const div = document.createElement('div');
  div.className = 'recipe-line';
  div.id = lineId;
  div.style.flexWrap = 'wrap';
  div.innerHTML = `
    <select onchange="onSaleLineProductChange('${lineId}')" style="width:100%; flex:none; margin-bottom:8px;">
      ${state.products.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${escapeHtml(p.name)} (disponível: ${fmtNum(p.stockQty||0)})</option>`).join('')}
    </select>
    <input type="number" step="1" placeholder="qtd" value="${qty}" oninput="updateSaleTotal()">
    <input type="number" step="0.01" placeholder="preço un." value="${price}" oninput="updateSaleTotal()">
    <button type="button" class="icon-btn" onclick="document.getElementById('${lineId}').remove(); updateSaleTotal();">${iconTrash()}</button>
  `;
  $('#saleLines').appendChild(div);
  updateSaleTotal();
}
function onSaleLineProductChange(lineId){
  const div = document.getElementById(lineId);
  const select = div.querySelector('select');
  const priceInput = div.querySelectorAll('input')[1];
  const product = state.products.find(p=>p.id===select.value);
  if(product) priceInput.value = product.sellPrice;
  updateSaleTotal();
}
function readSaleLines(){
  const container = $('#saleLines');
  if(!container) return [];
  return Array.from(container.children).map(line=>{
    const select = line.querySelector('select');
    const inputs = line.querySelectorAll('input');
    return {productId: select.value, qty: parseFloat(inputs[0].value)||0, unitPrice: parseFloat(inputs[1].value)||0};
  }).filter(l=>l.productId && l.qty>0);
}
function updateSaleTotal(){
  const items = readSaleLines();
  const total = items.reduce((s,it)=>s+it.qty*it.unitPrice,0);
  const el = $('#saleTotalPreview');
  if(el) el.innerHTML = `Total da venda: <strong>${fmt(total)}</strong>`;
}

function onSaleStatusChange(){
  const status = $('#sStatus').value;
  const el = $('#saleStatusFields');
  if(status==='pago'){
    el.innerHTML = `
      <div class="field">
        <label>Forma de pagamento</label>
        <select id="sMethod">
          <option value="pix">Pix</option>
          <option value="dinheiro">Dinheiro</option>
          <option value="cartao">Cartão</option>
        </select>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="field">
        <label>Data prevista para pagamento (opcional)</label>
        <input id="sDueDate" type="date">
      </div>`;
  }
}
async function saveSale(){
  const items = readSaleLines();
  const date = $('#sDate').value;
  const buyerName = $('#sBuyer').value.trim();
  const paymentStatus = $('#sStatus').value;
  const paymentMethod = paymentStatus==='pago' ? $('#sMethod').value : '';
  const dueDate = paymentStatus==='pendente' ? ($('#sDueDate').value||'') : '';
  if(items.length===0 || !date){
    showToast('Adicione pelo menos um item com quantidade válida, e preencha a data.', true);
    return;
  }
  sales.push({id:uid(), date, buyerName, paymentStatus, paymentMethod, dueDate, items});
  items.forEach(it=>{
    const product = state.products.find(p=>p.id===it.productId);
    if(product){
      const available = product.stockQty||0;
      if(it.qty>available){
        showToast(`Atenção: "${product.name}" só tinha ${fmtNum(available)} em estoque, ficou negativo.`, true);
      }
      product.stockQty = available - it.qty;
    }
  });
  render();
  saveSales();
  saveState();
}
async function markSalePaid(id){
  const sale = sales.find(s=>s.id===id);
  if(!sale) return;
  const method = await showPromptModal(`Como ${sale.buyerName||'a pessoa'} pagou? Digite: pix, dinheiro ou cartao`, 'pix');
  if(method===null) return;
  const m = method.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(!PAYMENT_LABELS[m]){ showToast('Digite pix, dinheiro ou cartao.', true); return; }
  sale.paymentStatus = 'pago';
  sale.paymentMethod = m;
  sale.dueDate = '';
  render();
  saveSales();
}
async function deleteSale(id){
  if(!(await showConfirmModal('Excluir esta venda? A quantidade volta para o estoque de brownies prontos.'))) return;
  const sale = sales.find(s=>s.id===id);
  if(sale){
    (sale.items||[]).forEach(it=>{
      const product = state.products.find(p=>p.id===it.productId);
      if(product) product.stockQty = (product.stockQty||0) + it.qty;
    });
  }
  sales = sales.filter(s=>s.id!==id);
  render();
  saveSales();
  saveState();
}

// ---------- RENDER: META ----------
function renderMeta(){
  const goal = state.goal;
  const sum = monthSummary();
  const goalIsProfit = goal.type === 'profit';
  const goalCurrent = goalIsProfit ? sum.profit : sum.revenue;
  const goalPct = goal.value>0 ? Math.min(100, (goalCurrent/goal.value*100)) : 0;
  const remaining = Math.max(0, goal.value - goalCurrent);
  const avgUnits = avgUnitsNeeded(remaining);

  const progressHTML = goal.value>0 ? `
    <div class="goal-card">
      <div class="row-between">
        <span class="goal-label">Progresso — ${goalIsProfit?'lucro':'faturamento'}</span>
        <span class="goal-pct">${goalPct.toFixed(0)}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${goalPct}%"></div></div>
      <div class="goal-meta"><span>${fmt(goalCurrent)} alcançado</span><span>faltam ${fmt(remaining)}</span></div>
      ${remaining<=0 ? `<div class="calc-preview" style="margin-top:12px;">Meta batida! 🎉</div>` :
        avgUnits>0 ? `<div class="calc-preview" style="margin-top:12px;">faltam em média <strong>${avgUnits} brownies</strong> pra chegar lá</div>` : ''}
      ${goalNeedListHTML(remaining)}
    </div>` : '';

  return `
    <h2 class="section-title">Meta mensal</h2>
    <p class="section-hint">Defina quanto você quer faturar ou lucrar por mês, e veja quanto falta e quantos brownies isso representa.</p>
    <div class="form-panel">
      <div class="field">
        <label>Tipo de meta</label>
        <select id="gType">
          <option value="profit" ${goal.type==='profit'?'selected':''}>Lucro mensal</option>
          <option value="revenue" ${goal.type==='revenue'?'selected':''}>Faturamento mensal</option>
        </select>
      </div>
      <div class="field">
        <label>Valor da meta (R$)</label>
        <input id="gValue" type="number" step="0.01" value="${goal.value||''}" placeholder="0,00">
      </div>
      <div class="form-actions">
        <button class="btn-primary" onclick="saveGoal()">Salvar meta</button>
      </div>
    </div>
    ${progressHTML}
    ${state.products.length===0 ? `
      <div class="empty-state">Cadastre produtos para ver quantas unidades vender por produto para bater a meta.</div>
    ` : ''}
  `;
}
async function saveGoal(){
  const type = $('#gType').value;
  const value = parseFloat($('#gValue').value)||0;
  state.goal = {type, value};
  activeTab = 'painel';
  render();
  updateTabsUI();
  saveState();
}

// ---------- ICONS ----------
function iconEdit(){ return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`; }
function iconTrash(){ return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>`; }
function iconPlus(){ return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`; }
function iconAlert(){ return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>`; }
function iconCheck(){ return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`; }

function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(str){ return escapeHtml(str); }

// ---------- MAIN RENDER ----------
function render(){
  if(!ready){ $('#mainContent').innerHTML = '<div class="loading">carregando seus dados…</div>'; return; }
  let html = '';
  if(activeTab==='painel') html = renderPainel();
  else if(activeTab==='ingredientes') html = renderIngredientes();
  else if(activeTab==='massas') html = renderMassas() + renderRecheios() + renderProdutos();
  else if(activeTab==='estoque') html = renderEstoque();
  else if(activeTab==='vendas') html = renderVendas();
  else if(activeTab==='fidelidade') html = renderFidelidade();
  else if(activeTab==='meta') html = renderMeta();
  $('#mainContent').innerHTML = `<section class="active">${html}</section>`;
  if(activeTab==='painel') renderSalesChart();
}

function updateTabsUI(){
  $$('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===activeTab));
}

$$('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeTab = btn.dataset.tab;
    updateTabsUI();
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  });
});

// ---------- LOCK / SENHA ----------
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function getAuthConfig(){
  try{
    const res = await window.storage.get(AUTH_KEY, true);
    return res && res.value ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}
async function setAuthConfig(cfg){
  await window.storage.set(AUTH_KEY, JSON.stringify(cfg), true);
}

function showLockError(msg){
  const el = $('#lockError');
  if(el) el.textContent = msg;
}

async function renderCreatePasswordScreen(){
  $('#lockBoxContent').innerHTML = `
    <span class="mark">Ponto do Brownie</span>
    <h2>Criar senha de acesso</h2>
    <p>Ninguém criou uma senha ainda. Defina uma para você e sua esposa usarem — quem tiver a senha entra.</p>
    <input id="lockPw1" type="password" placeholder="Nova senha" autocomplete="new-password">
    <input id="lockPw2" type="password" placeholder="Confirmar senha" autocomplete="new-password">
    <div class="lock-error" id="lockError"></div>
    <button class="btn-primary" onclick="submitCreatePassword()">Criar senha e entrar</button>
    <div class="hint">Essa senha protege o app de quem não conhece, mas fica guardada de forma simples — não use uma senha que você usa em outro lugar.</div>
  `;
  $('#lockPw2').addEventListener('keydown', e=>{ if(e.key==='Enter') submitCreatePassword(); });
}

async function submitCreatePassword(){
  const pw1 = $('#lockPw1').value;
  const pw2 = $('#lockPw2').value;
  if(!pw1 || pw1.length<4){ showLockError('Use pelo menos 4 caracteres.'); return; }
  if(pw1!==pw2){ showLockError('As senhas não são iguais.'); return; }
  const hash = await sha256(pw1);
  await setAuthConfig({hash});
  unlockApp();
}

function renderEnterPasswordScreen(){
  $('#lockBoxContent').innerHTML = `
    <span class="mark">Ponto do Brownie</span>
    <h2>Digite a senha</h2>
    <p>Esse app é compartilhado — digite a senha para acessar as vendas e custos do brownie.</p>
    <input id="lockPwEnter" type="password" placeholder="Senha" autocomplete="current-password">
    <div class="lock-error" id="lockError"></div>
    <button class="btn-primary" onclick="submitEnterPassword()">Entrar</button>
  `;
  const input = $('#lockPwEnter');
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submitEnterPassword(); });
  input.focus();
}

const FIXED_PASSWORD_HASH = '540c56f2e33bbb57632979d9171af7d2123742993690ddd10fcf041f5388cf99';

async function submitEnterPassword(){
  const pw = $('#lockPwEnter').value;
  const hash = await sha256(pw);
  if(hash!==FIXED_PASSWORD_HASH){
    showLockError('Senha incorreta. Tente de novo.');
    return;
  }
  unlockApp();
}

function unlockApp(){
  $('#lockScreen').style.display = 'none';
  boot();
}

async function initLock(){
  renderEnterPasswordScreen();
}

// ---------- INIT ----------
async function boot(){
  setHeaderDate();
  await loadData();
  render();
}
initLock();
</script>

<script>
const STORAGE_KEY = 'appData';
const SALES_KEY = 'sales';
const AUTH_KEY = 'authConfig';

let state = {
  ingredients: [],
  bases: [],
  fillings: [],
  packaging: [],
  products: [],
  goal: { type: 'profit', value: 0 }
};
let sales = [];
let ready = false;
let activeTab = 'painel';
let recipeLineCount = 0;

const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);
const fmt = n => (Number(n)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtNum = n => (Number(n)||0).toLocaleString('pt-BR', {maximumFractionDigits:2});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function setHeaderDate(){
  const d = new Date();
  $('#headerDate').textContent = `${MONTHS[d.getMonth()]} de ${d.getFullYear()}`;
}

// ---------- STORAGE (Google Sheets via Apps Script) ----------
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzvA-c9Y-KtMC_NLJenbDEfBqFWd3LBTUlScxbZXRTxsxxhs1e3cfZL1FzmREHCfHbOqQ/exec';

async function sheetGet(key){
  try{
    const res = await fetch(`${GAS_URL}?key=${encodeURIComponent(key)}`);
    const text = await res.text();
    if(!text || text==='null') return null;
    return JSON.parse(text);
  }catch(e){
    console.error('erro ao ler '+key, e);
    return null;
  }
}
async function sheetSet(key, value){
  try{
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({key, value})
    });
    const text = await res.text();
    const parsed = JSON.parse(text);
    return !!(parsed && parsed.ok);
  }catch(e){
    console.error('erro ao salvar '+key, e);
    return false;
  }
}

async function loadData(){
  const parsed = await sheetGet(STORAGE_KEY);
  if(parsed) state = Object.assign(state, parsed);
  const salesData = await sheetGet(SALES_KEY);
  if(salesData) sales = salesData;
  ready = true;
}

function showToast(message, isError=false){
  const banner = document.createElement('div');
  banner.textContent = message;
  banner.style.cssText = `position:fixed;left:16px;right:16px;bottom:90px;z-index:200;background:${isError?'#8A362F':'#3A2318'};color:#FAF3E7;padding:12px 16px;border-radius:10px;font-family:Inter,sans-serif;font-size:13px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,0.3);`;
  document.body.appendChild(banner);
  setTimeout(()=>banner.remove(), 4000);
}
function showSaveError(){
  showToast('Não consegui salvar agora — verifique sua internet e tente de novo em instantes.', true);
}

function showConfirmModal(message){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <p>${escapeHtml(message)}</p>
        <div class="modal-actions">
          <button class="btn-cancel" id="modalCancelBtn">Cancelar</button>
          <button class="btn-primary" id="modalConfirmBtn" style="margin-top:0;">Confirmar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#modalCancelBtn').onclick = ()=>{ overlay.remove(); resolve(false); };
    overlay.querySelector('#modalConfirmBtn').onclick = ()=>{ overlay.remove(); resolve(true); };
  });
}

function showPromptModal(message, defaultValue=''){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <p>${escapeHtml(message)}</p>
        <input id="modalPromptInput" type="text" value="${escapeAttr(defaultValue)}">
        <div class="modal-actions">
          <button class="btn-cancel" id="modalCancelBtn">Cancelar</button>
          <button class="btn-primary" id="modalConfirmBtn" style="margin-top:0;">OK</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#modalPromptInput');
    input.focus();
    input.select();
    const submit = ()=>{ const v = input.value; overlay.remove(); resolve(v); };
    overlay.querySelector('#modalCancelBtn').onclick = ()=>{ overlay.remove(); resolve(null); };
    overlay.querySelector('#modalConfirmBtn').onclick = submit;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  });
}

async function storageSetWithRetry(key, value, attempts=2){
  for(let i=0; i<attempts; i++){
    const ok = await sheetSet(key, value);
    if(ok) return true;
    if(i<attempts-1){ await new Promise(r=>setTimeout(r, 700)); }
  }
  return false;
}

async function saveState(){
  const ok = await storageSetWithRetry(STORAGE_KEY, JSON.stringify(state));
  if(!ok) showSaveError();
}
async function saveSales(){
  const ok = await storageSetWithRetry(SALES_KEY, JSON.stringify(sales));
  if(!ok) showSaveError();
}

// ---------- CALC HELPERS ----------
function ingredientUnitCost(ing){
  if(!ing.packageQty) return 0;
  return ing.packageCost / ing.packageQty;
}
function currentPackages(ing){
  if(!ing.packageQty) return 0;
  return (ing.stockQty||0) / ing.packageQty;
}
function isLowStock(ing){
  if(!ing.minStockPackages || ing.minStockPackages<=0) return false;
  return currentPackages(ing) < ing.minStockPackages;
}
function lowStockIngredients(){
  return state.ingredients.filter(isLowStock);
}
function baseCost(base){
  if(!base) return {totalBatch:0, costPerUnit:0};
  const ingCost = (base.items||[]).reduce((sum, item)=>{
    const ing = state.ingredients.find(i=>i.id===item.ingredientId);
    if(!ing) return sum;
    return sum + ingredientUnitCost(ing) * item.qty;
  }, 0);
  const totalBatch = ingCost + (Number(base.extraCost)||0);
  const yieldQty = Number(base.yield) || 1;
  return {totalBatch, costPerUnit: totalBatch/yieldQty};
}
function fillingCost(filling){
  if(!filling) return {totalBatch:0, costPerUnit:0};
  const ingCost = (filling.items||[]).reduce((sum, item)=>{
    const ing = state.ingredients.find(i=>i.id===item.ingredientId);
    if(!ing) return sum;
    return sum + ingredientUnitCost(ing) * item.qty;
  }, 0);
  const pkgCost = (filling.packaging||[]).reduce((sum, item)=>{
    const pkg = state.packaging.find(i=>i.id===item.packagingId);
    if(!pkg) return sum;
    return sum + packagingUnitCost(pkg) * item.qty;
  }, 0);
  const totalBatch = ingCost + pkgCost + (Number(filling.extraCost)||0);
  const yieldQty = Number(filling.yield) || 1;
  return {totalBatch, costPerUnit: totalBatch/yieldQty};
}
function getProductFillings(product){
  if(product.fillings && product.fillings.length) return product.fillings;
  if(product.fillingId) return [{fillingId: product.fillingId, qty: product.fillingQty||0}];
  return [];
}
function consumeIngredientsForProduction(product, qty){
  if(!product) return;
  (product.items||[]).forEach(item=>{
    const pkg = state.packaging.find(i=>i.id===item.packagingId);
    if(!pkg) return;
    const perUnit = item.qty / (Number(product.yield)||1);
    pkg.stockQty = (pkg.stockQty||0) - perUnit*qty;
  });
  if(product.baseId){
    const base = state.bases.find(b=>b.id===product.baseId);
    if(base){
      const baseAmountPerUnit = (Number(product.baseQty)||0) / (Number(product.yield)||1);
      (base.items||[]).forEach(item=>{
        const ing = state.ingredients.find(i=>i.id===item.ingredientId);
        if(!ing) return;
        const perUnitOfBase = item.qty / (Number(base.yield)||1);
        ing.stockQty = (ing.stockQty||0) - perUnitOfBase * baseAmountPerUnit * qty;
      });
    }
  }
  getProductFillings(product).forEach(f=>{
    const filling = state.fillings.find(x=>x.id===f.fillingId);
    if(!filling) return;
    const fillingAmountPerUnit = (Number(f.qty)||0) / (Number(product.yield)||1);
    (filling.items||[]).forEach(item=>{
      const ing = state.ingredients.find(i=>i.id===item.ingredientId);
      if(!ing) return;
      const perUnitOfFilling = item.qty / (Number(filling.yield)||1);
      ing.stockQty = (ing.stockQty||0) - perUnitOfFilling * fillingAmountPerUnit * qty;
    });
    (filling.packaging||[]).forEach(item=>{
      const pkg = state.packaging.find(i=>i.id===item.packagingId);
      if(!pkg) return;
      const perUnitOfFilling = item.qty / (Number(filling.yield)||1);
      pkg.stockQty = (pkg.stockQty||0) - perUnitOfFilling * fillingAmountPerUnit * qty;
    });
  });
}
function productCost(product){
  const pkgCost = (product.items||[]).reduce((sum, item)=>{
    const pkg = state.packaging.find(i=>i.id===item.packagingId);
    if(!pkg) return sum;
    return sum + packagingUnitCost(pkg) * item.qty;
  }, 0);
  let baseComponentCost = 0;
  if(product.baseId){
    const base = state.bases.find(b=>b.id===product.baseId);
    if(base){
      baseComponentCost = baseCost(base).costPerUnit * (Number(product.baseQty)||0);
    }
  }
  let fillingComponentCost = 0;
  getProductFillings(product).forEach(f=>{
    const filling = state.fillings.find(x=>x.id===f.fillingId);
    if(filling) fillingComponentCost += fillingCost(filling).costPerUnit * (Number(f.qty)||0);
  });
  const totalBatch = pkgCost + baseComponentCost + fillingComponentCost + (Number(product.extraCost)||0);
  const yieldQty = Number(product.yield) || 1;
  return totalBatch / yieldQty;
}
function productMargin(product){
  const cost = productCost(product);
  const price = Number(product.sellPrice)||0;
  const margin = price - cost;
  const pct = price ? (margin/price*100) : 0;
  return {cost, margin, pct};
}
function goalNeedListHTML(remaining){
  if(!state.products.length) return '';
  const goalIsProfit = state.goal.type==='profit';
  let html = `<div class="goal-need-list">`;
  state.products.forEach(p=>{
    const {margin} = productMargin(p);
    const basis = goalIsProfit ? margin : Number(p.sellPrice);
    let text;
    if(remaining<=0){ text = 'meta batida ✓'; }
    else if(basis<=0){ text = '—'; }
    else { text = `${Math.ceil(remaining/basis)} un.`; }
    html += `<div class="goal-need-row"><span class="pname">${escapeHtml(p.name)}</span><span class="pval">${text}</span></div>`;
  });
  html += `</div>`;
  return html;
}
function avgUnitsNeeded(remaining){
  const goalIsProfit = state.goal.type==='profit';
  const bases = state.products.map(p=>{
    const {margin} = productMargin(p);
    return goalIsProfit ? margin : Number(p.sellPrice);
  }).filter(b=>b>0);
  if(!bases.length || remaining<=0) return 0;
  const avgBasis = bases.reduce((a,b)=>a+b,0)/bases.length;
  return avgBasis>0 ? Math.ceil(remaining/avgBasis) : 0;
}
let painelMonth = new Date().toISOString().slice(0,7); // 'YYYY-MM'

let salesChartInstance = null;
const MONTHS_SHORT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function salesForMonth(yearMonth){
  return sales.filter(s=>s.date && s.date.startsWith(yearMonth));
}
function currentMonthSales(){
  return salesForMonth(new Date().toISOString().slice(0,7));
}
function saleTotal(sale){
  return (sale.items||[]).reduce((sum,it)=>sum+it.qty*it.unitPrice,0);
}
function summaryForSales(list){
  let revenue=0, cost=0, unitsSold=0;
  list.forEach(s=>{
    (s.items||[]).forEach(it=>{
      const p = state.products.find(pr=>pr.id===it.productId);
      revenue += it.qty * it.unitPrice;
      cost += p ? productCost(p) * it.qty : 0;
      unitsSold += it.qty;
    });
  });
  return {revenue, cost, profit: revenue-cost, count: list.length, unitsSold};
}
function monthSummary(){
  return summaryForSales(currentMonthSales());
}
function monthSummaryFor(yearMonth){
  return summaryForSales(salesForMonth(yearMonth));
}
function daySummary(dateStr){
  const list = sales.filter(s=>s.date===dateStr);
  return summaryForSales(list);
}

// ---------- CHART DATA ----------
function revenueByDateMap(){
  const map = {};
  sales.forEach(s=>{ map[s.date] = (map[s.date]||0) + saleTotal(s); });
  return map;
}
function dailyChartData(yearMonth){
  const [y,m] = yearMonth.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const revByDate = revenueByDateMap();
  const labels=[], data=[];
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    labels.push(String(d));
    data.push(revByDate[dateStr]||0);
  }
  return {labels, data};
}
function weeklyChartData(yearMonth){
  const {data: dayData} = dailyChartData(yearMonth);
  const weeks = {};
  dayData.forEach((val, idx)=>{
    const weekNum = Math.ceil((idx+1)/7);
    weeks[weekNum] = (weeks[weekNum]||0) + val;
  });
  return {labels: Object.keys(weeks).map(w=>`Sem ${w}`), data: Object.values(weeks)};
}
function monthlyChartData(yearMonth){
  const [y,m] = yearMonth.split('-').map(Number);
  const revByDate = revenueByDateMap();
  const labels=[], data=[];
  for(let i=11; i>=0; i--){
    const d = new Date(y, m-1-i, 1);
    const yy = d.getFullYear(), mm = d.getMonth()+1;
    const prefix = `${yy}-${String(mm).padStart(2,'0')}`;
    let sum = 0;
    Object.keys(revByDate).forEach(dateStr=>{ if(dateStr.startsWith(prefix)) sum += revByDate[dateStr]; });
    labels.push(`${MONTHS_SHORT[mm-1]}/${String(yy).slice(2)}`);
    data.push(sum);
  }
  return {labels, data};
}
function renderSalesChart(){
  const canvas = document.getElementById('salesChart');
  if(!canvas || typeof Chart==='undefined') return;
  let chartData;
  if(painelChartMode==='dia') chartData = dailyChartData(painelMonth);
  else if(painelChartMode==='semana') chartData = weeklyChartData(painelMonth);
  else chartData = monthlyChartData(painelMonth);
  if(salesChartInstance){ salesChartInstance.destroy(); }
  salesChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: { labels: chartData.labels, datasets: [{ data: chartData.data, backgroundColor:'#A8433D', borderRadius:4, maxBarThickness:32 }] },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => fmt(ctx.parsed.y) } } },

}

function packagingUnitCost(pkg){
  if(!pkg.packageQty) return 0;
  return pkg.packageCost / pkg.packageQty;
}
function currentPackagingPackages(pkg){
  if(!pkg.packageQty) return 0;
  return (pkg.stockQty||0) / pkg.packageQty;
}
function isLowStockPackaging(pkg){
  if(!pkg.minStockPackages || pkg.minStockPackages<=0) return false;
  return currentPackagingPackages(pkg) < pkg.minStockPackages;
}
function lowStockPackaging(){
  return state.packaging.filter(isLowStockPackaging);
}

async function restockPackaging(id){
  const pkg = state.packaging.find(i=>i.id===id);
  if(!pkg) return;
  const result = await showPurchaseModal(`Registrar compra — "${pkg.name}"`);
  if(!result) return;
  const qty = parseFloat(String(result.qty).replace(',','.'));
  const price = parseFloat(String(result.price).replace(',','.'));
  if(isNaN(qty) || qty<=0 || isNaN(price) || price<=0){
    showToast('Preencha quantidade e valor pago corretamente.', true);
    return;
  }
  pkg.purchases = pkg.purchases || [];
  pkg.purchases.push({qty, totalPaid: price, date: new Date().toISOString().slice(0,10)});
  pkg.stockQty = (pkg.stockQty||0) + qty*pkg.packageQty;
  const totalQtyBought = pkg.purchases.reduce((s,p)=>s+p.qty,0);
  const totalSpent = pkg.purchases.reduce((s,p)=>s+p.totalPaid,0);
  pkg.packageCost = totalSpent/totalQtyBought;
  render();
  saveState();
}

async function savePackaging(editId){
  const name = $('#pkgName').value.trim();
  const cost = parseFloat($('#pkgCost').value);
  const qty = parseFloat($('#pkgQty').value);
  const unit = $('#pkgUnitToggle').dataset.value;
  const stockPackages = parseFloat($('#pkgStock').value)||0;
  const minStockPackages = parseFloat($('#pkgMinStock').value)||0;
  if(!name || isNaN(cost) || isNaN(qty) || qty<=0){
    showToast('Preencha nome, preço e quantidade corretamente.', true);
    return;
  }
  const stockQty = stockPackages*qty;
  if(editId){
    const pkg = state.packaging.find(i=>i.id===editId);
    Object.assign(pkg, {name, packageCost:cost, packageQty:qty, unit, stockQty, minStockPackages});
  } else {

async function restockIngredient(id){
  const ing = state.ingredients.find(i=>i.id===id);
  if(!ing) return;
  const result = await showPurchaseModal(`Registrar compra — "${ing.name}"`);
  if(!result) return;
  const qty = parseFloat(String(result.qty).replace(',','.'));
  const price = parseFloat(String(result.price).replace(',','.'));
  if(isNaN(qty) || qty<=0 || isNaN(price) || price<=0){
    showToast('Preencha quantidade e valor pago corretamente.', true);
    return;
  }
  ing.purchases = ing.purchases || [];
  ing.purchases.push({qty, totalPaid: price, date: new Date().toISOString().slice(0,10)});
  ing.stockQty = (ing.stockQty||0) + qty*ing.packageQty;
  const totalQtyBought = ing.purchases.reduce((s,p)=>s+p.qty,0);
  const totalSpent = ing.purchases.reduce((s,p)=>s+p.totalPaid,0);
  ing.packageCost = totalSpent/totalQtyBought;
  render();
  saveState();
}

function showPurchaseModal(message){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <p>${escapeHtml(message)}</p>
        <div class="field" style="margin-bottom:12px;">
          <label>Quantas embalagens você comprou?</label>
          <input id="modalQtyInput" type="number" step="0.1" placeholder="Ex: 5">
        </div>
        <div class="field" style="margin-bottom:6px;">
          <label>Quanto pagou no total (R$)?</label>
          <input id="modalPriceInput" type="number" step="0.01" placeholder="Ex: 24,90">
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" id="modalCancelBtn">Cancelar</button>
          <button class="btn-primary" id="modalConfirmBtn" style="margin-top:0;">Adicionar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const qtyInput = overlay.querySelector('#modalQtyInput');
    const priceInput = overlay.querySelector('#modalPriceInput');
    qtyInput.focus();
    const submit = ()=>{
      const val = {qty: qtyInput.value, price: priceInput.value};
      overlay.remove();
      resolve(val);
    };
    overlay.querySelector('#modalCancelBtn').onclick = ()=>{ overlay.remove(); resolve(null); };
    overlay.querySelector('#modalConfirmBtn').onclick = submit;
    [qtyInput, priceInput].forEach(inp=>inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); }));
  });
}

function updateCalcPreview(){
  const items = readPackagingLinesFrom('recipeLines');
  const extra = parseFloat($('#pExtra')?.value)||0;
  const yieldQty = parseFloat($('#pYield')?.value)||0;
  const price = parseFloat($('#pPrice')?.value)||0;
  const pkgCost = items.reduce((sum,item)=>{
    const pkg = state.packaging.find(i=>i.id===item.packagingId);
    return pkg ? sum + packagingUnitCost(pkg)*item.qty : sum;
  },0);
  let baseComponentCost = 0;
  const baseSelect = $('#pBase');
  if(baseSelect && baseSelect.value){
    const base = state.bases.find(b=>b.id===baseSelect.value);
    const baseQty = parseFloat($('#pBaseQty')?.value)||0;
    if(base) baseComponentCost = baseCost(base).costPerUnit * baseQty;
  }
  let fillingComponentCost = 0;
  readFillingLines().forEach(f=>{
    const filling = state.fillings.find(x=>x.id===f.fillingId);
    if(filling) fillingComponentCost += fillingCost(filling).costPerUnit * f.qty;
  });
  const totalBatch = pkgCost + baseComponentCost + fillingComponentCost + extra;
  const costPerUnit = yieldQty>0 ? totalBatch/yieldQty : 0;
  const margin = price - costPerUnit;
  const pct = price ? (margin/price*100) : 0;
  const el = $('#calcPreview');
  if(!el) return;
  el.innerHTML = `${baseComponentCost>0?`custo da massa usada: ${fmt(baseComponentCost)}<br>`:''}${fillingComponentCost>0?`custo dos recheios usados: ${fmt(fillingComponentCost)}<br>`:''}custo da receita: ${fmt(totalBatch)}<br>custo por unidade: ${fmt(costPerUnit)}<br>margem por unidade: ${fmt(margin)} (${pct.toFixed(0)}%)`;
}

function updateBaseCalcPreview(){

async function deleteBase(id){

async function deleteFilling(id){
  const usedBy = state.products.filter(p=>getProductFillings(p).some(x=>x.fillingId===id));
  const msg = usedBy.length>0
    ? `Excluir este recheio? ${usedBy.length} produto(s) usam ele e ele será removido da receita deles.`
    : 'Excluir este recheio?';
  if(!(await showConfirmModal(msg))) return;

    p.fillingQty = 0;
  });
  render();
  saveState();
}
